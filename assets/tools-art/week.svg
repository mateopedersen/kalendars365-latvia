<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="title desc"><title id="title">Nedēļas kalendārs</title><desc id="desc">Kalendārs365 oriģināla vektoru ilustrācija: Septiņu dienu plāns ar atsevišķām pierakstu slejām. Apjoms veidots ar materiālu gaismēnām, atspīdumiem un perspektīvu.</desc><defs>
