<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="title desc"><title id="title">Saullēkts un saulriets</title><desc id="desc">Kalendārs365 oriģināla vektoru ilustrācija: Saule virs ūdens ar gaismas atspīdumu. Apjoms veidots ar materiālu gaismēnām, atspīdumiem un perspektīvu.</desc><defs>
