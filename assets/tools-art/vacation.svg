<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="title desc"><title id="title">Atvaļinājuma plānotājs</title><desc id="desc">Kalendārs365 oriģināla vektoru ilustrācija: Ceļojumu koferis ar reljefu virsmu un bagāžas birku. Apjoms veidots ar materiālu gaismēnām, atspīdumiem un perspektīvu.</desc><defs>
