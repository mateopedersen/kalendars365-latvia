<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="kv-seasons-title kv-seasons-description"><title id="kv-seasons-title">Gadalaiki</title><desc id="kv-seasons-description">Kalendāram365 radīta oriģināla vektoru ilustrācija ar apjoma, gaismas un materiālu zīmējumu. Fotogrāfijas un pikseļu attēli nav izmantoti.</desc><defs>
<linearGradient id="kv-seasons-paper" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fffaf0"/><stop offset=".57" stop-color="#eee5d4"/><stop offset="1" stop-color="#b7ae9c"/></linearGradient>
<linearGradient id="kv-seasons-wine" x1="0" y1="0" x2=".95" y2="1"><stop stop-color="#bf6a83"/><stop offset=".4" stop-color="#973f5a"/><stop offset="1" stop-color="#5d2036"/></linearGradient>
<linearGradient id="kv-seasons-teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ec5b8"/><stop offset=".48" stop-color="#488c80"/><stop offset="1" stop-color="#24574f"/></linearGradient>
<linearGradient id="kv-seasons-gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff2b7"/><stop offset=".22" stop-color="#d1aa5b"/><stop offset=".4" stop-color="#f1d68b"/><stop offset=".67" stop-color="#ad8439"/><stop offset="1" stop-color="#7b5b2c"/></linearGradient>
<linearGradient id="kv-seasons-metal" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#fafdfb"/><stop offset=".2" stop-color="#c6d0d0"/><stop offset=".43" stop-color="#fbfcf3"/><stop offset=".6" stop-color="#9cabae"/><stop offset="1" stop-color="#4c636d"/></linearGradient>
<linearGradient id="kv-seasons-ink" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#66747d"/><stop offset=".45" stop-color="#35424f"/><stop offset="1" stop-color="#17242f"/></linearGradient>
<radialGradient id="kv-seasons-glass" cx="30%" cy="20%" r="85%"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#eaf5ed" stop-opacity=".3"/><stop offset="1" stop-color="#86a3ae" stop-opacity=".55"/></radialGradient>
<filter id="kv-seasons-shadow" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#35262d" flood-opacity=".17"/></filter>
<filter id="kv-seasons-soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs><defs><linearGradient id="kv-seasons-bark" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#b69973"/><stop offset=".35" stop-color="#927356"/><stop offset="1" stop-color="#5c4a3c"/></linearGradient><linearGradient id="kv-seasons-leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4c89b"/><stop offset=".45" stop-color="#658e69"/><stop offset="1" stop-color="#315c51"/></linearGradient><linearGradient id="kv-seasons-autumn" x2=".85" y2=".9"><stop stop-color="#f2d38c"/><stop offset=".38" stop-color="#d6a455"/><stop offset=".78" stop-color="#b57143"/><stop offset="1" stop-color="#813f37"/></linearGradient><radialGradient id="kv-seasons-petal" cx="30%" cy="22%"><stop stop-color="#fffbeb"/><stop offset=".65" stop-color="#f3dce0"/><stop offset="1" stop-color="#ce9fae"/></radialGradient><linearGradient id="kv-seasons-frost" x2=".9" y2="1"><stop stop-color="#ffffff"/><stop offset=".4" stop-color="#d5e7e6"/><stop offset="1" stop-color="#89b2bd"/></linearGradient></defs>
 <ellipse cx="163" cy="235" rx="79" ry="7" fill="#6b5146" opacity=".12" filter="url(#kv-seasons-soft)"/>
