<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="kv-garden-title kv-garden-description"><title id="kv-garden-title">Sējas un stādīšanas kalendārs</title><desc id="kv-garden-description">Kalendāram365 radīta oriģināla vektoru ilustrācija ar apjoma, gaismas un materiālu zīmējumu. Fotogrāfijas un pikseļu attēli nav izmantoti.</desc><defs>
<linearGradient id="kv-garden-paper" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fffaf0"/><stop offset=".57" stop-color="#eee5d4"/><stop offset="1" stop-color="#b7ae9c"/></linearGradient>
<linearGradient id="kv-garden-wine" x1="0" y1="0" x2=".95" y2="1"><stop stop-color="#bf6a83"/><stop offset=".4" stop-color="#973f5a"/><stop offset="1" stop-color="#5d2036"/></linearGradient>
<linearGradient id="kv-garden-teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ec5b8"/><stop offset=".48" stop-color="#488c80"/><stop offset="1" stop-color="#24574f"/></linearGradient>
<linearGradient id="kv-garden-gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff2b7"/><stop offset=".22" stop-color="#d1aa5b"/><stop offset=".4" stop-color="#f1d68b"/><stop offset=".67" stop-color="#ad8439"/><stop offset="1" stop-color="#7b5b2c"/></linearGradient>
<linearGradient id="kv-garden-metal" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#fafdfb"/><stop offset=".2" stop-color="#c6d0d0"/><stop offset=".43" stop-color="#fbfcf3"/><stop offset=".6" stop-color="#9cabae"/><stop offset="1" stop-color="#4c636d"/></linearGradient>
<linearGradient id="kv-garden-ink" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#66747d"/><stop offset=".45" stop-color="#35424f"/><stop offset="1" stop-color="#17242f"/></linearGradient>
<radialGradient id="kv-garden-glass" cx="30%" cy="20%" r="85%"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#eaf5ed" stop-opacity=".3"/><stop offset="1" stop-color="#86a3ae" stop-opacity=".55"/></radialGradient>
<filter id="kv-garden-shadow" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#35262d" flood-opacity=".17"/></filter>
<filter id="kv-garden-soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs><defs><linearGradient id="kv-garden-steel" x1=".15" y1=".2" x2=".9" y2=".7"><stop stop-color="#f0efdf"/><stop offset=".28" stop-color="#b9c7c5"/><stop offset=".49" stop-color="#e6ebe1"/><stop offset=".55" stop-color="#91a8ad"/><stop offset="1" stop-color="#4e737d"/></linearGradient><linearGradient id="kv-garden-wood" x2="1" y2=".5"><stop stop-color="#dabd88"/><stop offset=".45" stop-color="#b18b5e"/><stop offset="1" stop-color="#7a5c40"/></linearGradient><linearGradient id="kv-garden-carrot" x1="0" y1=".15" x2="1" y2=".75"><stop stop-color="#ffdc91"/><stop offset=".2" stop-color="#ecad58"/><stop offset=".55" stop-color="#d68237"/><stop offset="1" stop-color="#a8552e"/></linearGradient><linearGradient id="kv-garden-greens" x1=".1" y1="0" x2=".95" y2="1"><stop stop-color="#b5c795"/><stop offset=".45" stop-color="#648b63"/><stop offset="1" stop-color="#2e6354"/></linearGradient><radialGradient id="kv-garden-soil" cx="38%" cy="25%" r="80%"><stop stop-color="#a28a67"/><stop offset=".5" stop-color="#725d48"/><stop offset="1" stop-color="#3c3b32"/></radialGradient></defs>
