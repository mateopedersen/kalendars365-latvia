<section id="calendar-app" class="collection-calendar-app" aria-label="Interaktīvais kalendārs">
  <div class="card main-calendar collection-calendar-card">
    <div class="calendar-heading"><div class="calendar-arrows"><button data-action="prev" aria-label="Iepriekšējais periods">‹</button><button data-action="next" aria-label="Nākamais periods">›</button></div><h2 id="calendar-title">Kalendārs</h2><div class="calendar-heading-actions"><button data-action="today">Šodien</button><button class="primary add-event" data-action="add-event" aria-label="Pievienot notikumu"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Pievienot notikumu</span></button></div></div>
    <div class="calendar-controls"><div class="view-tabs" role="group" aria-label="Kalendāra skats"><button data-view="month" aria-pressed="true">Mēnesis</button><button data-view="week" aria-pressed="false">Nedēļa</button><button data-view="day" aria-pressed="false">Diena</button><button data-view="list" aria-pressed="false">Saraksts</button><button data-view="year" aria-pressed="false">Gads</button></div><select id="calendar-month" aria-label="Mēnesis"></select><select id="calendar-year" aria-label="Gads"></select></div>
    <div class="collection-calendar-metrics"><span><b id="metric-week">—</b> ISO nedēļa</span><span><b id="metric-day">—</b> gada diena</span><span><b id="metric-month">—</b> dienas mēnesī</span></div>
    <label class="collection-event-search">Meklēt notikumu<input id="event-filter" type="search" placeholder="Vārds vai notikums" aria-label="Meklēt kalendāra notikumu"></label>
    <div id="category-filters" class="category-filters" role="group" aria-label="Notikumu kategorija"></div><div id="calendar-view" aria-live="polite"></div>
    <div class="calendar-footer"><div class="calendar-legend"><span><i class="dot"></i>Šodien</span><span><i class="dot pale"></i>Svētki</span></div><div class="actions"><button data-action="print"><svg class="icon" aria-hidden="true"><use href="#i-print"/></svg>Drukāt</button><button data-action="export-ics"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Eksportēt ICS</button></div></div>
  </div>
  <div class="collection-personal-grid">
    <section class="card day-plan"><div class="card-heading"><h2>Atlasītā diena</h2></div><p id="selected-day-label" class="muted"></p><div id="day-events"></div><button data-action="add-event">+ Pievienot notikumu</button></section>
    <section class="card notes-card"><div class="card-heading"><h2>Dienas piezīme</h2><span id="notes-status" class="save-status">Šajā ierīcē</span></div><textarea id="notes" maxlength="20000" aria-label="Piezīmes izvēlētajai dienai" placeholder="Kas šodien svarīgs?"></textarea></section>
    <section class="card tasks-card"><h2>Mani uzdevumi</h2><div id="task-list"></div><form id="task-form" class="inline-form"><input name="task" aria-label="Jauns uzdevums" placeholder="Pievienot uzdevumu" maxlength="200" required><button class="primary" aria-label="Pievienot uzdevumu">+</button></form></section>
  </div>
  <details class="collection-local-tools"><summary>Mani kalendāri un datu rīki</summary><div id="calendar-layers" class="layer-grid"></div><div class="actions"><button data-action="settings">Iestatījumi</button><button data-action="backup">Datu dublējums</button><button data-action="import-ics">Importēt ICS</button><button data-action="export-ics">Eksportēt ICS</button></div></details>
</section>
