<div class="sun-experience" data-sun-experience>
  <div class="sun-view-switch" role="group" aria-label="Saules skata veids">
    <button type="button" data-sun-renderer="panorama" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M5 21h14M7 17a5 5 0 0 1 10 0M12 3v3M3 9l2 2m16-2-2 2"/></svg>Saules panorāma</button>
    <button type="button" data-sun-renderer="map" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 8 6-3 6 3 6-3v14l-6 3-6-3-6 3V8Zm6-3v14m6-11v14"/></svg>Pilsētas 3D karte</button>
  </div>
  <figure class="sun-stage" data-sun-stage aria-label="Saules gaismas panorāma izvēlētajai pilsētai un laikam">
    <img class="sun-stage-fallback" data-sun-photo src="{{ sky_city.photo.src }}" alt="{{ sky_city.photo.alt | escape }}" width="960" height="600" loading="lazy">
    <canvas class="sun-panorama" data-sun-panorama width="1200" height="700" role="img" aria-label="Aprēķinātā Saules gaisma ilustratīvā Latvijas ainavā"></canvas>
    <div class="sun-map" data-sun-map aria-label="Interaktīva 3D pilsētas karte"></div>
    <div class="sun-stage-top">
      <span class="sun-stage-badge"><i></i><span data-sun-mode>Saules panorāma</span></span>
      <span class="sun-stage-clock"><time data-sun-scene-clock></time><small>Latvijas laiks</small></span>
    </div>
    <div class="sun-stage-caption"><span class="sun-stage-kicker" data-sun-light>Dienasgaisma</span><strong data-sun-city>{{ sky_city.name }}</strong><span data-sun-coordinates></span></div>
    <div class="sun-view-status" data-sun-view-status></div>
    <div class="sun-compass" data-sun-compass aria-hidden="true"></div>
    <figcaption class="sun-panorama-caption">Ilustratīva ainava · aprēķināts Saules virziens</figcaption>
  </figure>
  <div class="sun-scene-toolbar">
    <div class="sun-map-tools" role="group" aria-label="Skata virziena vadība">
      <button type="button" data-sun-rotate="-30" aria-label="Pagriezt skatu pa kreisi par 30 grādiem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 9M4 4v6h6"/></svg></button>
      <button type="button" data-sun-follow aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>Sekot Saulei</button>
      <button type="button" data-sun-rotate="30" aria-label="Pagriezt skatu pa labi par 30 grādiem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-2 9m2-15v6h-6"/></svg></button>
    </div>
    <label class="sun-landscape-label">Ainava<select data-sun-landscape aria-label="Ilustratīvās ainavas veids"><option value="water">Ūdensmala</option><option value="meadow">Pļava</option><option value="forest">Mežmala</option></select></label>
  </div>
  <div class="sun-scene-meta"><span data-sun-bearing>Skata virziens</span><span data-sun-render-status role="status">Gatavo gaismas panorāmu…</span><button type="button" data-sun-retry hidden>Atkārtoti ielādēt karti</button></div>
  <div class="sun-moments" role="group" aria-label="Izvēlies dienas brīdi">
    <button type="button" data-sun-moment="dawn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M6 21h12M8 17a4 4 0 0 1 8 0M12 4v3M4 10l2 2m14-2-2 2"/></svg><span>Rītausma<small data-sun-moment-time="dawn">—</small></span></button>
    <button type="button" data-sun-moment="sunrise"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M5 21h14M7 17a5 5 0 0 1 10 0M12 3v5m-3-2 3-3 3 3M3 11l2 2m16-2-2 2"/></svg><span>Saullēkts<small data-sun-moment-time="sunrise">—</small></span></button>
    <button type="button" data-sun-moment="solarNoon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Pusdienlaiks<small data-sun-moment-time="solarNoon">—</small></span></button>
    <button type="button" data-sun-moment="goldenHour"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10" r="4"/><path d="M12 1v2M3 4l2 2m16-2-2 2M2 11h2m16 0h2M3 18h18M5 22h14"/></svg><span>Zelta stunda<small data-sun-moment-time="goldenHour">—</small></span></button>
    <button type="button" data-sun-moment="sunset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M5 21h14M7 17a5 5 0 0 1 10 0M12 3v5m-3-2 3 3 3-3M3 11l2 2m16-2-2 2"/></svg><span>Saulriets<small data-sun-moment-time="sunset">—</small></span></button>
    <button type="button" data-sun-moment="dusk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a8 8 0 0 1-11-11A8.5 8.5 0 1 0 20 15Z"/><path d="m18 3 .5 2 2 .5-2 .5-.5 2-.5-2-2-.5 2-.5Z"/></svg><span>Vakara krēsla<small data-sun-moment-time="dusk">—</small></span></button>
  </div>
  <p class="sun-scene-note">Saules stāvoklis atbilst izvēlētajai pilsētai, datumam un laikam. Panorāmas ainava un atmosfēra ir ilustratīva. Reālas ielas un ēku kontūras apskati 3D kartē. <a href="#sky-model">Par vizualizāciju</a></p>
</div>
