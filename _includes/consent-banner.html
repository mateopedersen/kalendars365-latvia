<aside class="consent-banner" id="consent-banner" aria-labelledby="consent-title" aria-describedby="consent-description">
  <div class="consent-art" aria-hidden="true"><img src="/assets/consent-cookie.svg?v={{ site.data.build.asset_version }}" width="128" height="128" alt=""></div>
  <div class="consent-copy">
    <span class="consent-eyebrow"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3.5" y="7" width="9" height="7" rx="2"/><path d="M5.5 7V4.5a2.5 2.5 0 0 1 5 0V7M8 10v1.5"/></svg>Sīkdatnes un privātums</span>
    <h2 id="consent-title">Tavi plāni. Tava izvēle.</h2>
    <p id="consent-description">Tavas izvēles un personīgie kalendāra plāni paliek šajā ierīcē. Bez reklāmas un analītikas izsekotājiem. <a href="/sikdatnu-politika/">Par sīkdatnēm<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M4 12 12 4M5 4h7v7"/></svg></a></p>
  </div>
  <div class="consent-controls">
    <div class="consent-decisions">
      <button type="button" class="consent-necessary" data-consent="necessary">Tikai nepieciešamās</button>
      <button type="button" class="consent-accept" data-consent="all"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Piekrītu</button>
    </div>
    <button type="button" class="consent-manage" data-action="consent"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6 3v4m8 1v4M8 13v4" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>Pārvaldīt izvēles</button>
  </div>
</aside>
