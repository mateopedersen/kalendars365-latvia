{% assign share_cover = site.data["social-images"].pages[page.url] %}
<div hidden id="share-page-data" data-url="{{ page.url | escape }}" data-title="{{ page.title | escape }}" data-image="{{ seo.assets.image | escape }}" data-credits="{% for photo in share_cover.sources %}{% unless forloop.first %} · {% endunless %}{{ photo.author | default: photo.credit | escape }} · {{ photo.license | escape }}{% endfor %}"></div>
<p class="share-bootstrap-status" role="status" hidden></p>
<script defer src="/assets/share-entry.js?v={{ site.data.build.asset_version }}"></script>
