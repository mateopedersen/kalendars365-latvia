<div hidden id="share-page-data" data-url="{{ page.url | escape }}" data-title="{{ page.title | escape }}" data-image="{{ social_image_path | escape }}" data-credits="{% for photo in social_cover.sources %}{% unless forloop.first %} · {% endunless %}{{ photo.author | default: photo.credit | escape }} · {{ photo.license | escape }}{% endfor %}"></div>
<button type="button" class="share-fab" data-share-open aria-label="Kopīgot šo lapu: 55 iespējas"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 14v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"/></svg><span>Kopīgot</span><b>55</b></button>
<p class="share-bootstrap-status" role="status" hidden></p>
<noscript><p class="share-no-script"><a href="https://t.me/share/url?url={{ page.url | absolute_url | url_encode }}&amp;text={{ page.title | url_encode }}" target="_blank" rel="noopener noreferrer">Kopīgot Telegram</a> · <a href="mailto:?subject={{ page.title | url_encode }}&amp;body={{ page.url | absolute_url | url_encode }}">Nosūtīt e-pastā</a></p></noscript>
<script defer src="/assets/share-entry.js?v={{ site.data.build.asset_version }}"></script>
