name: Verify daily editorial freshness
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # This check uses only Ruby's standard JSON/Date libraries, no Gemfile.
      - run: /usr/bin/ruby -v
      - run: /usr/bin/ruby scripts/verify_daily.rb
