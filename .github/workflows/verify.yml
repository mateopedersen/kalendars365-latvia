name: Verify Latvia calendar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.cache/ruby-runtime
            node_modules/.cache/bundle
          key: ${{ runner.os }}-${{ runner.arch }}-ruby-4.0.9-${{ hashFiles('scripts/bootstrap-ruby.sh') }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ruby-4.0.9-${{ hashFiles('scripts/bootstrap-ruby.sh') }}-
      - name: Install Ruby compilation headers
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libyaml-dev libreadline-dev zlib1g-dev libffi-dev pkg-config
      - name: Build with verified Ruby 4.0.9
        run: bash scripts/cloudflare-build.sh
      - run: node test/date_core_test.cjs
      - run: node test/date_l10n_test.cjs
      - run: node test/frontend_test.cjs
      - run: node test/sky_test.mjs
      - run: node test/astronomy-reference.test.mjs
      - run: node test/celestial-media.test.mjs
      - run: node test/svg-art.test.cjs
      - run: node test/observations.test.mjs
      - run: node test/horoscope-edge.test.mjs
      - run: node test/presentation.test.cjs
      - run: node test/planning_test.cjs
      - run: node test/print.test.cjs
      - run: node test/print_fonts_test.cjs
      - run: node test/print_personalization_test.cjs
      - name: Verify Ruby calculations and built pages
        shell: bash
        run: |
          source scripts/bootstrap-ruby.sh
          export BUNDLE_PATH="$PWD/node_modules/.cache/bundle"
          export BUNDLE_FROZEN=true
          bundle _4.0.20_ exec ruby test/date_test.rb
          ruby scripts/audit.rb
