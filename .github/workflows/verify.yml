name: Verify Latvia calendar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.cache/ruby-runtime
            node_modules/.cache/bundle
          key: ${{ runner.os }}-ubuntu24.04-${{ runner.arch }}-ruby-4.0.9-${{ hashFiles('scripts/bootstrap-ruby.sh') }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu24.04-${{ runner.arch }}-ruby-4.0.9-${{ hashFiles('scripts/bootstrap-ruby.sh') }}-
      - name: Install Ruby compilation headers
        shell: bash
        run: |
          # Check the actual compiler and Ruby extension headers, not optional meta-packages.
          if command -v cc >/dev/null && command -v make >/dev/null && command -v pkg-config >/dev/null && pkg-config --exists openssl yaml-0.1 zlib libffi; then
            echo 'Ruby compiler and required extension headers are already available.'
            exit 0
          fi
          packages=(build-essential libssl-dev libyaml-dev libreadline-dev zlib1g-dev libffi-dev pkg-config)
          missing=()
          for package in "${packages[@]}"; do
            if [[ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null)" != 'install ok installed' ]]; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y "${missing[@]}"
          else
            echo 'Ruby compilation headers are already installed.'
          fi
      - name: Build with verified Ruby 4.0.9
        run: bash scripts/cloudflare-build.sh
      - run: node test/date_core_test.cjs
      - run: node test/date_l10n_test.cjs
      - run: node test/frontend_test.cjs
      - run: node test/import_safety_test.cjs
      - run: node test/search.test.cjs
      - run: node test/hubs.test.cjs
      - run: node test/school-experience.test.cjs
      - run: node --test test/work-calendar.test.cjs
      - run: node --test test/calendar-studio.test.mjs
      - run: node --test test/category-photo-assets.test.cjs
      - run: node --test test/category-experience.test.mjs
      - run: node --test test/editorial-logic.test.mjs
      - run: node --test test/category-advanced.test.mjs
      - run: node --test test/useful-pages.test.mjs
      - run: node --test test/garden-experience.test.cjs
      - run: node test/sky_test.mjs
      - run: node test/astronomy-reference.test.mjs
      - run: node test/celestial-media.test.mjs
      - run: node test/svg-art.test.cjs
      - run: node --test test/month-art.test.mjs
      - run: node --test test/tradition-links.test.mjs
      - run: node --test test/tradition-cards.test.mjs
      - run: node test/observations.test.mjs
      - run: node --test test/location.test.mjs
      - run: node test/city-switch.test.cjs
      - run: node test/horoscope-edge.test.mjs
      - run: node --test test/ascendant.test.mjs
      - run: node --test test/internal-navigation.test.mjs
      - run: node --test test/functional-regressions.test.mjs
      - run: node --test test/editorial-links.test.mjs
      - run: python3 scripts/audit_editorial_links.py --site _site --output /tmp/kalendars-editorial-links.json --strict
      - run: python3 scripts/audit_internal_links.py --site _site --output /tmp/kalendars-internal-links.json --strict
      - run: node test/presentation.test.cjs
      - run: node test/planning_test.cjs
      - run: node test/print.test.cjs
      - run: node test/print_fonts_test.cjs
      - run: node test/print_personalization_test.cjs
      - run: node test/lunar-prints.test.mjs
      - run: node test/a3-gallery.test.cjs
      - run: node test/a3-month-gallery.test.cjs
      - run: node --test test/calendar-collection.test.cjs
      - run: node --test test/responsive-previews.test.cjs test/seo-performance.test.cjs test/style-bundles.test.cjs test/mobile-performance.test.cjs test/critical-css.test.mjs
      - run: node --test test/page-reading.test.mjs
      - run: node --test test/blog.test.mjs
      - run: node --test test/sitemaps.test.mjs
      - run: node --test test/astronomy-event-art.test.mjs
      - run: node --test test/tools-directory.test.mjs
      - run: node --test test/weekly-planner.test.mjs
      - run: node --test test/family-planner.test.mjs
      - run: node --test test/vacation-planner.test.mjs
      - run: node --test test/shift-planner.test.mjs
      - run: node --test test/school-planner.test.mjs
      - run: node --test test/solar-directory-chart.test.mjs test/sun-scene.test.mjs
      - run: node --test test/social-covers.test.cjs
      - run: npm ci --prefix tooling/sharing --ignore-scripts --no-audit --no-fund
      - run: node --test test/sharing.test.mjs
      - run: node --test test/tradition-photo-headers.test.mjs test/traditions-guide.test.mjs
      - name: Verify Ruby calculations and built pages
        shell: bash
        run: |
          source scripts/bootstrap-ruby.sh
          export BUNDLE_PATH="$PWD/node_modules/.cache/bundle"
          export BUNDLE_FROZEN=true
          bundle _4.0.20_ exec ruby test/date_test.rb
          ruby scripts/audit.rb
